apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.15.0
    helm:
      valuesObject:
        executor: KubernetesExecutor
        dags:
          gitSync:
            enabled: true
            repo: https://github.com/OWNER/dataforge.git
            branch: main
            subPath: airflow/dags
        webserver:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
