apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# ATTENTION : les transformations d'image de Kustomize s'enchainent.
# La base a deja renomme llm-service -> ghcr.io/sory89/dataforge/llm-service,
# donc l'overlay doit cibler CE nom, pas le nom d'origine.
images:
  - name: ghcr.io/sory89/dataforge/llm-service
    newName: llm-service
    newTag: local

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Rollout
      name: llm-service
