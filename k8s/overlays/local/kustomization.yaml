apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# En local Minikube : image buildée dans le daemon interne, pas de registry
images:
  - name: llm-service
    newName: llm-service
    newTag: local

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Rollout
      name: llm-service
