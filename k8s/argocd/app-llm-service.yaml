apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sory89/dataforge.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: dataforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
