name: CD Staging

on:
  push:
    branches: [main]

permissions:
  contents: write   # necessaire au push du bump de tag par update-gitops
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/llm-service

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: llm_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}
      - name: Bump image tag staging (ArgoCD sync auto ensuite)
        run: |
          sed -i "s|newTag:.*|newTag: sha-${GITHUB_SHA}|" k8s/base/kustomization.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "cd(staging): image sha-${GITHUB_SHA}" || echo "no change"
          git push
