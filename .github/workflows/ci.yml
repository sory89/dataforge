name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.6.8 sqlfluff==3.1.1
      - name: Ruff (Python)
        run: ruff check airflow llm_service tests
      - name: SQLFluff (dbt models)
        run: sqlfluff lint dbt/models --dialect duckdb
      - name: Hadolint (Dockerfiles)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: llm_service/Dockerfile

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (DAG import + logique + service LLM)
        run: pytest tests airflow/tests -v --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (scan only)
        run: docker build -f llm_service/Dockerfile -t llm-service:scan .
      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: llm-service:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # ne bloque que sur les CVE corrigeables
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: llm-service:scan
          format: spdx-json
          artifact-name: sbom-llm-service.spdx.json

  llm-eval-gate:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Construire la base de référence (dbt)
        run: cd dbt && dbt build --target ci --profiles-dir .
      - name: Gate évaluation Text-to-SQL par exécution (mock en CI)
        run: python llm_service/eval/run_eval.py --threshold 0.80 --mock
